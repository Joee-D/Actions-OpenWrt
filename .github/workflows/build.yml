name: OpenWrt Builder x86

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: openwrt-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: v25.12.5
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT "$PWD"
          git clone --single-branch --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Cache package downloads
        uses: actions/cache@v6.1.0
        with:
          path: /workdir/openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('config', 'feeds.conf.default', 'diy-part1.sh', 'diy-part2.sh') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-

      - name: Load feeds and configuration
        run: |
          if [ -e "$FEEDS_CONF" ]; then
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cd ..
          if [ -e files ]; then
            mv files openwrt/files
          fi
          if [ -e "$CONFIG_FILE" ]; then
            # Snapshot the seed symbols (the settings we intentionally override)
            grep -oE '^(# )?CONFIG_[A-Za-z0-9_-]+' "$CONFIG_FILE" | sed -E 's/^# //' | sort -u > /tmp/seed-symbols.txt
            mv "$CONFIG_FILE" openwrt/.config
          fi
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"
          make defconfig
          # Guard: every seed symbol must still exist after defconfig.
          # A missing symbol means it was renamed/removed upstream - fail
          # loudly instead of silently dropping a package on version bumps.
          if [ -s /tmp/seed-symbols.txt ]; then
            missing=""
            while read -r sym; do
              grep -qE "^# ${sym} is not set|^${sym}=" .config || missing="$missing $sym"
            done < /tmp/seed-symbols.txt
            if [ -n "$missing" ]; then
              echo "::error::Seed options missing after make defconfig (renamed or removed upstream):"
              echo "$missing"
              exit 1
            fi
          fi

      - name: Download package sources
        run: |
          cd openwrt
          make download -j"$(nproc)" || make download -j1 V=s
          find dl -type f ! -path 'dl/go-mod-cache/*' -size -1024c -print -delete

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          echo "threads=$(nproc)" >> "$GITHUB_OUTPUT"
          make -j"$(nproc)" || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [ -s DEVICE_NAME ]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          fi
          echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenWrt_build_logs_${{ github.run_id }}
          path: |
            openwrt/.config
            openwrt/logs/
            openwrt/tmp/log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check disk usage
        if: always()
        run: df -hT

      - name: Upload bin directory
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin
          if-no-files-found: error

      - name: Organize firmware files
        id: organize
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware directory
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}
          if-no-files-found: error

      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"
          touch release.txt
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3.0.3
        if: steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2.1.0
        if: steps.compile.outputs.status == 'success'
        with:
          retain_days: 0
          keep_minimum_runs: 2

      - name: Remove old releases
        if: steps.tag.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | \
            tail -n +4 | \
            xargs -r -n1 gh release delete --yes --cleanup-tag
