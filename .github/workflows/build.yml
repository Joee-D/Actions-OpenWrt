name: OpenWrt Builder x86_64

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: openwrt-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: v25.12.5
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget
          if [ -x /usr/local/bin/runc ]; then
            sudo mv /usr/local/bin/runc /usr/local/bin/runc.disabled
          fi
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone --single-branch --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Set toolchain cache key
        id: toolchain-key
        run: |
          echo "rev=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "target=$(grep -E '^CONFIG_TARGET_' config | sort -u | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v6.1.0
        with:
          path: |
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/staging_dir/host*
            /workdir/openwrt/staging_dir/toolchain-*
          key: openwrt-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.REPO_BRANCH }}-${{ steps.toolchain-key.outputs.rev }}-${{ steps.toolchain-key.outputs.target }}
          restore-keys: |
            openwrt-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.REPO_BRANCH }}-${{ steps.toolchain-key.outputs.rev }}-

      - name: Cache package downloads
        uses: actions/cache@v6.1.0
        with:
          path: /workdir/openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('config', 'feeds.conf.extra') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-

      - name: Configure source
        run: |
          cat feeds.conf.extra >> openwrt/feeds.conf.default
          cp config openwrt/.config
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenWrt_build_logs_${{ github.run_id }}
          path: |
            openwrt/.config
            openwrt/logs/
            openwrt/tmp/log/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          firmware_dir=$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d -print -quit)
          test -n "$firmware_dir"
          rm -rf "$firmware_dir/packages"
          tag=$(date +%Y.%m.%d-%H%M)
          gh release create "$tag" --title "$tag" --notes "Automated OpenWrt firmware build." "$firmware_dir"/*
