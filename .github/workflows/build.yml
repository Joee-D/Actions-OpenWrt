name: OpenWrt Builder x86_64

on:
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: openwrt-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: v25.12.5
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget
          if [ -x /usr/local/bin/runc ]; then
            sudo mv /usr/local/bin/runc /usr/local/bin/runc.disabled
          fi
          sudo install -d -o "$USER" -g "$(id -gn)" /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone --single-branch --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Set toolchain cache key
        id: toolchain-key
        run: |
          echo "rev=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "target=$(grep -E '^CONFIG_TARGET_' config | sort -u | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v6.1.0
        with:
          path: |
            /workdir/openwrt/build_dir/host
            /workdir/openwrt/build_dir/toolchain-*
            /workdir/openwrt/staging_dir/host*
            /workdir/openwrt/staging_dir/toolchain-*
          key: openwrt-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.REPO_BRANCH }}-${{ steps.toolchain-key.outputs.rev }}-${{ steps.toolchain-key.outputs.target }}
          restore-keys: |
            openwrt-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.REPO_BRANCH }}-${{ steps.toolchain-key.outputs.rev }}-
            openwrt-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.REPO_BRANCH }}-

      - name: Cache package downloads
        uses: actions/cache@v6.1.0
        with:
          path: /workdir/openwrt/dl
          # key 不含 config，否则每次改包都会写出数 GB 新缓存
          key: openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('feeds.conf.extra') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-

      - name: Configure source
        run: |
          cat feeds.conf.extra >> openwrt/feeds.conf.default
          # cd 限定在子 shell：openwrt 是符号链接，外层 cd .. 会落到 /workdir
          ( cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a )
          cp config openwrt/.config
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          make -C openwrt defconfig

      - name: Verify defconfig kept requested symbols
        run: |
          # 符号名含连字符（luci-app-* 等），字符类不能漏掉 -
          missing="$(grep -E '^CONFIG_[A-Za-z0-9_.-]+=y$' config | cut -d= -f1 | while read -r sym; do
            grep -q "^${sym}=y$" openwrt/.config || echo "$sym"
          done)"
          if [ -n "$missing" ]; then
            echo "::error::make defconfig dropped requested symbols: $(echo "$missing" | tr '\n' ' ')"
            exit 1
          fi
          echo "OK: all requested =y symbols survived defconfig"

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j"$(( $(nproc) + 1 ))" || make download -j1 V=s

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j"$(( $(nproc) + 1 ))" || make -j1 V=s

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: OpenWrt_build_logs_${{ github.run_id }}
          # logs/ 需 CONFIG_BUILD_LOG=y，tmp/log/ 无写入点，所以只传 .config
          path: openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          firmware_dir=$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d -print -quit)
          test -n "$firmware_dir"
          if [ -z "$(find "$firmware_dir" -maxdepth 1 -name '*combined-efi.img*' -print -quit)" ]; then
            echo "::error::no combined-efi image in $firmware_dir, refusing to publish"
            ls -l "$firmware_dir"
            exit 1
          fi
          rm -rf "$firmware_dir/packages"
          # tag 带 run number；re-run 复用同一编号，故先删旧 release
          tag=$(date +%Y.%m.%d-%H%M)-${GITHUB_RUN_NUMBER}
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --title "$tag" --notes "Automated OpenWrt firmware build." "$firmware_dir"/*
